name: Scheduled Railway Restart

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: {}

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Restart Railway service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway restart --service a672cdd0-2808-4c44-bbc7-f59abf49662c --yes
