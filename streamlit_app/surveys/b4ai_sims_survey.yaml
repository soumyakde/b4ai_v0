---
title: B4AI SIMS Survey

sections:
  - name: Learner_Name
    questions:
      - id: Q1_1
        text: >
          Activity: Module 1 - Maze: Write your first name initial and
          last name initial in the box.
        type: text
        placeholder: "Enter initials"
        system_date: true
        required: true

  - name: Intrinsic_motivation
    questions:
      - id: Q2_1
        text: >
          Choose the explanation that best matches your answer to the question:
          Why are you currently engaged in this activity? Because I think that
          this activity is interesting.
        type: select
        options:
          - "Strongly disagree"
          - "Disagree"
          - "Agree"
          - "Strongly agree"

      - id: Q2_2
        text: >
          Choose the explanation that best matches your answer to the question:
          Why are you currently engaged in this activity? Because I like doing
          this activity.
        type: select
        options:
          - "Strongly disagree"
          - "Disagree"
          - "Agree"
          - "Strongly agree"

      - id: Q2_3
        text: >
          Choose the explanation that best matches your answer to the question:
          Why are you currently engaged in this activity? Because I feel good
          when doing this activity.
        type: select
        options:
          - "Strongly disagree"
          - "Disagree"
          - "Agree"
          - "Strongly agree"

