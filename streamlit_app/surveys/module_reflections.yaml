# Shared reflection questions for all modules
# Student-facing, ages 10–12
---
instrument_key: module_reflections
instrument_type: assessment
version: 1.0

module_id: global
scope: pre_post
REFLECTION_QUESTIONS:
  - id: conceptual_change
    text: |
      Think about what you knew about AI before this module and what you know now.

      What is one new thing about AI that you can explain now that you couldn’t explain before this module?

      Use an example from a game, activity, or video in this module to help explain your answer.

  - id: module_takeaway
    text: |
      In your own words, what did this module teach you about AI?

      Use examples from the games or activities to explain:
      • what AI does or how it works, and
      • why those examples helped you understand AI better.

      You can also share:
      • whether this felt easy or hard to understand, and
      • if anything in this module reminded you of your own life, interests, or experiences.
