---
# KNOWN ITEM-WORDING ISSUE (flagged 2026-09-01, not yet corrected in live data):
# Q10_2 ("I thought about whether I agreed with the topic conflicts based on
# my culture") is a convoluted, double-embedded construction that may be hard
# for 10-14-year-old respondents to parse correctly, independent of its
# reverse-scoring polarity (which is internally consistent with Q10_1/Q9_1/
# Q9_2 -- see b4ai_sccces_scoring.yaml). Existing pilot responses predate this
# note and cannot be re-collected; before treating Q10_2 as equivalent in
# quality to Q10_1, run the retrospective comprehension checks described in
# the project's SCCCES composite-scoring analysis (item-total correlation of
# Q10_2 vs. Q10_1 within Culture; Q10_1-Q10_2 inter-item correlation as a
# comprehension proxy; missing/inconsistent-response rate on Q10_2 vs. other
# 2-item sub-constructs; age-stratified comparison). If a future revision of
# this instrument is fielded, simplify Q10_2's wording (e.g., a single direct
# question such as "This topic made me think about my own beliefs or values")
# before reusing it.
instrument_key: b4ai_sccces_survey
instrument_type: survey
version: 1.0

module_id: global
scope: pre_post
title: "C: B4AI Cognitive Engagement Survey"

sections:
  - name: Engagement_with_task
    questions:
      - id: Q2_1
        text: "I was engaged with the topic at hand."
        type: select
        options:
          - "Strongly disagree"
          - "Disagree"
          - "Agree"
          - "Strongly agree"

  - name: Effort_and_persistence
    questions:
      - id: Q3_1
        text: "I put in a lot of effort."
        type: select
        options:
          - "Strongly disagree"
          - "Disagree"
          - "Agree"
          - "Strongly agree"

      - id: Q3_2
        text: "I wish we could still continue with the work for a while."
        type: select
        options:
          - "Strongly disagree"
          - "Disagree"
          - "Agree"
          - "Strongly agree"

  - name: Experience_of_flow
    questions:
      - id: Q4_1
        text: "I was so involved that I forgot everything around me."
        type: select
        options:
          - "Strongly disagree"
          - "Disagree"
          - "Agree"
          - "Strongly agree"

  - name: Coherency_of_messaging
    questions:
      - id: Q5_1
        text: >
          While going through this module, I thought about whether the
          information was well organized.
        type: select
        options:
          - "Strongly disagree"
          - "Disagree"
          - "Agree"
          - "Strongly agree"

      - id: Q5_2
        text: >
          While going through this module, I considered whether the
          information was easy to understand.
        type: select
        options:
          - "Strongly disagree"
          - "Disagree"
          - "Agree"
          - "Strongly agree"

      - id: Q5_3
        text: >
          While going through this module, I thought about whether the
          information flowed well.
        type: select
        options:
          - "Strongly disagree"
          - "Disagree"
          - "Agree"
          - "Strongly agree"

  - name: Plausibility_of_messaging
    questions:
      - id: Q6_1
        text: >
          While going through this module, I thought about whether the
          information was believable.
        type: select
        options:
          - "Strongly disagree"
          - "Disagree"
          - "Agree"
          - "Strongly agree"

      - id: Q6_2
        text: >
          While going through this module, I thought about whether the
          information was reasonable.
        type: select
        options:
          - "Strongly disagree"
          - "Disagree"
          - "Agree"
          - "Strongly agree"

  - name: Credibility_of_messaging
    questions:
      - id: Q7_1
        text: >
          While going through this module, I thought about whether the source
          of the information was trustworthy.
        type: select
        options:
          - "Strongly disagree"
          - "Disagree"
          - "Agree"
          - "Strongly agree"

      - id: Q7_2
        text: >
          While going through this module, I thought about whether the source
          of the information was believable.
        type: select
        options:
          - "Strongly disagree"
          - "Disagree"
          - "Agree"
          - "Strongly agree"

  - name: Comprehensibility_of_messaging
    questions:
      - id: Q8_1
        text: >
          While going through this module, I thought about whether the
          information presented was easy to follow.
        type: select
        options:
          - "Strongly disagree"
          - "Disagree"
          - "Agree"
          - "Strongly agree"

      - id: Q8_2
        text: >
          While going through this module, I thought about whether the
          information was clear.
        type: select
        options:
          - "Strongly disagree"
          - "Disagree"
          - "Agree"
          - "Strongly agree"

  - name: Attention
    questions:
      - id: Q9_1
        text: "I was having trouble paying attention during the module."
        type: select
        options:
          - "Strongly disagree"
          - "Disagree"
          - "Agree"
          - "Strongly agree"

      - id: Q9_2
        text: "I was distracted by other thoughts during the module."
        type: select
        options:
          - "Strongly disagree"
          - "Disagree"
          - "Agree"
          - "Strongly agree"

  - name: Culture
    questions:
      - id: Q10_1
        text: >
          While going through this module, I thought about whether the topic
          conflicts with my culture (for example, religion or family values).
        type: select
        options:
          - "Strongly disagree"
          - "Disagree"
          - "Agree"
          - "Strongly agree"

      - id: Q10_2
        text: >
          While going through this module, I thought about whether I agreed
          with the topic conflicts based on my culture (for example, religion
          or family values).
        type: select
        options:
          - "Strongly disagree"
          - "Disagree"
          - "Agree"
          - "Strongly agree"

  - name: Personal_relevance
    questions:
      - id: Q11_1
        text: >
          While going through this module, I thought about how this topic
          relates to things I like or care about.
        type: select
        options:
          - "Strongly disagree"
          - "Disagree"
          - "Agree"
          - "Strongly agree"

      - id: Q11_2
        text: >
          While going through this module, I thought about how the information
          could be useful to me.
        type: select
        options:
          - "Strongly disagree"
          - "Disagree"
          - "Agree"
          - "Strongly agree"

      - id: Q11_3
        text: >
          While going through this module, I thought about how the activities
          would be helpful to my personal goals.
        type: select
        options:
          - "Strongly disagree"
          - "Disagree"
          - "Agree"
          - "Strongly agree"
