# WORDING v2.0 - effective for responses submitted from 2026-10-05 onward.
# Q3_4 and Q3_6 were reworded for clarity (v1.0 wording: Q3_4 'AI methods work similar to the brain.';
# Q3_6 '...are all examples of AI.'). Question IDs and answer keys are UNCHANGED (Q3_4 False, Q3_6 Yes),
# so scoring is unaffected, but Q3_4/Q3_6 must be analysed separately before/after 2026-10-05.
# v1.0 copy: docs/instrument_versions/ (kept outside surveys/ because every *.yaml here is loaded).
---
instrument_key: pre_ai_misconceptions_assessment
instrument_type: assessment
version: 2.0

module_id: global
scope: pre
title: "Pre-Intervention: What you know about AI already?"

questions:
  - id: Q3_1
    text: "AI systems learn from data and feedback to decide and act on their own."
    type: select
    options:
      - "True"
      - "False"

  - id: Q3_2
    text: >
      I always identify a machine to be an AI machine if it imitates human
      characteristics like voice, movements, and appearance.
    type: select
    options:
      - "True"
      - "False"

  - id: Q3_3
    text: "AI systems have emotions and intuitions."
    type: select
    options:
      - "True"
      - "False"

  - id: Q3_4
    text: "AI methods work in exactly the same way as the human brain."
    type: select
    options:
      - "True"
      - "False"

  - id: Q3_5
    text: "Any software that uses a database is AI."
    type: select
    options:
      - "Yes"
      - "No"

  - id: Q3_6
    text: >
      Recommendation systems in games, social media, or search engines that learn
      from what you do are examples of AI.
    type: select
    options:
      - "Yes"
      - "No"

  - id: Q3_7
    text: "Can something be called AI if it does not involve technology?"
    type: select
    options:
      - "Yes"
      - "No"

  - id: Q3_8
    text: >
      Would you consider AI as a machine with pre-installed knowledge or
      intelligence?
    type: select
    options:
      - "Yes"
      - "No"
