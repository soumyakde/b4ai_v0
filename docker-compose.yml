# docker-compose.yml — Basics4AI (Phase A: SQLite)
# Phase C will add PostgreSQL service here
version: "3.9"

services:
  app:
    build: .
    image: basics4ai:latest
    container_name: basics4ai_app
    ports:
      - "8501:8501"
    env_file:
      - .env          # your local .env with API keys
    environment:
      - DB_TYPE=sqlite
      - SQLITE_PATH=/app/data/responses.db
    volumes:
      # Mount databases as persistent volumes so data survives container restarts
      - ./responses.db:/app/data/responses.db
      - ./users.db:/app/data/users.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
