
services:
  app:
    build: .
    image: basics4ai:latest
    container_name: basics4ai_app
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - DB_TYPE=sqlite
      - SQLITE_PATH=/app/data/responses.db
      - USERS_DB_PATH=/app/data/users.db
      - RESEARCH_DB_PATH=/app/data/research.db
    volumes:
      - ./responses.db:/app/data/responses.db
      - ./users.db:/app/data/users.db
      - ./research.db:/app/data/research.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3